# Explicit rollback to the preserved Python gateway.
services:
  gateway:
    image: didaction-gateway-python:local
    build:
      target: gateway-python
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=5)",
        ]
