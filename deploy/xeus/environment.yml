name: didaction-xeus
channels:
  - https://prefix.dev/emscripten-forge-4x
  - https://prefix.dev/conda-forge
dependencies:
  # emscripten-forge-4x currently publishes Python 3.13 only. Keep this
  # environment on the channel ABI rather than pretending a 3.12 pin resolves.
  - xeus-python
  - numpy
  - scipy
  - pandas
  - networkx
  - sympy
  - ipywidgets
  - numba=0.67.0
  - llvmlite=0.49.0
  - matplotlib
