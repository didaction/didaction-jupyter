name: Bug report
description: Report reproducible incorrect notebook behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, private notebooks, sensitive outputs, or vulnerability details. Use the private process in SECURITY.md for security reports.
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Browser-local (Pyodide)
        - Browser-local (xeus-python)
        - Jupyter server (Rust gateway)
        - Container deployment
        - Other or unknown
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or build revision
      description: The Git SHA shown in Diagnostics, if available.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, kernel name/version, and startup command.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Relevant screenshots, console messages, or bounded test output.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private notebook content, and sensitive outputs.
          required: true
