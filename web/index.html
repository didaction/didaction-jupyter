<!doctype html>
<html lang="en">
  <head>
    <!--
      impeccable:direction-contract
      FORM seed: user-pinned-original-jupyter
      THESIS: one familiar local notebook shared safely by people and browser tools
      OWN-WORLD: original Jupyter Notebook's vertical document and compact IDE chrome
      STORY: open, edit, execute, observe, recover, and resume the same kernel state
      FIRST VIEWPORT: working code cells, committed output, kernel status, and controls
      FORM: restrained sans UI, monospace code, flat light canvas, thin dividers,
      selected-cell emphasis, quiet state changes, and no decorative motion
      FINISH: visible focus, bounded actionable failures, responsive controls, and
      one validated egui/WebMCP command path
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>didaction notebook</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#notebook-canvas">Skip to notebook</a>
    <header class="shell-header" aria-label="Notebook application">
      <div>
        <button
          id="explorer-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="file-explorer"
          aria-label="Toggle workspace explorer"
          title="Hide workspace explorer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 4h18v16H3Z M9 4v16" />
            <path class="explorer-chevron" d="m16 9-3 3 3 3" />
          </svg></button
        ><strong>didaction</strong><span>local notebook</span>
      </div>
      <div class="collaboration-controls">
        <output
          id="driver-status"
          role="status"
          aria-live="polite"
          title="You control this notebook"
          hidden
          >Driver</output
        >
        <output id="follow-status" role="status" aria-live="polite"></output>
      </div>
    </header>
    <div class="workspace-layout">
      <aside id="file-explorer" aria-label="Notebook file explorer">
        <h2>Notebooks</h2>
        <p id="folder-path">Workspace</p>
        <div class="folder-actions">
          <button id="folder-up" type="button" disabled>Up</button
          ><button id="folder-refresh" type="button">Refresh</button>
        </div>
        <ul id="notebook-files"></ul>
        <p id="explorer-status" role="status">Connecting…</p>
      </aside>
      <main id="notebook-shell" aria-label="Interactive notebook">
        <div
          class="canvas-accessibility"
          role="toolbar"
          aria-label="Notebook collaboration"
        >
          <button
            id="follow-driver"
            type="button"
            aria-pressed="false"
            disabled
          >
            Follow driver
          </button>
        </div>
        <output
          id="connection-status"
          class="canvas-accessibility"
          role="status"
          aria-live="polite"
          >Connecting…</output
        >
        <canvas
          id="notebook-canvas"
          tabindex="0"
          aria-label="Notebook editor canvas"
        ></canvas>
        <section
          id="fatal-error"
          class="fatal-error"
          hidden
          aria-live="assertive"
        >
          <h1>The notebook could not start</h1>
          <p></p>
          <button type="button" onclick="location.reload()">Retry</button>
        </section>
      </main>
    </div>
    <p class="privacy-note">
      Local execution is unsafe. Only run notebooks you trust.
    </p>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
